<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sistema de gestión de productos y ventas - Aplicaciones Web 2 - IES Siglo 21">
  <title>Sistema de Gestión | AppWeb2 Final</title>

  <!-- TailwindCSS v3 via CDN (Play CDN - sin build step) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Font: Inter para tipografía moderna -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Configuración personalizada de Tailwind -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
          },
          colors: {
            primary: { 50:'#eef2ff',100:'#e0e7ff',200:'#c7d2fe',300:'#a5b4fc',400:'#818cf8',500:'#6366f1',600:'#4f46e5',700:'#4338ca',800:'#3730a3',900:'#312e81' },
            surface: { 50:'#f8fafc',100:'#f1f5f9',200:'#e2e8f0',300:'#cbd5e1',700:'#334155',800:'#1e293b',900:'#0f172a',950:'#020617' },
          }
        }
      }
    }
  </script>

  <style>
    /* ============================================================
       Estilos personalizados para la SPA
       ============================================================ */

    /* Transición suave al cambiar de sección */
    .section-view {
      animation: fadeIn 0.3s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Efecto hover suave en filas de tabla */
    .table-row-hover:hover {
      background-color: rgba(99, 102, 241, 0.05);
      transition: background-color 0.2s ease;
    }

    /* Efecto glassmorphism para cards */
    .glass-card {
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    /* Toast notification */
    .toast {
      animation: slideIn 0.4s ease, fadeOut 0.4s ease 2.6s forwards;
    }

    @keyframes slideIn {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }

    @keyframes fadeOut {
      from { opacity: 1; }
      to { opacity: 0; }
    }

    /* Scrollbar personalizada */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #64748b; }

    /* Botón con efecto de ripple al hacer click */
    .btn-primary {
      transition: all 0.2s ease;
    }
    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
    }
    .btn-primary:active {
      transform: translateY(0);
    }

    /* Badge animado */
    .badge-pulse {
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }

    /* Loading spinner */
    .spinner {
      border: 3px solid #e2e8f0;
      border-top: 3px solid #6366f1;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>

<body class="bg-gradient-to-br from-surface-50 via-white to-primary-50 min-h-screen font-sans text-surface-800">

  <!-- ============================================================
       CONTENEDOR DE TOASTS (Notificaciones)
       ============================================================ -->
  <div id="toast-container" class="fixed top-4 right-4 z-50 flex flex-col gap-2"></div>

  <!-- ============================================================
       NAVBAR - Barra de navegación principal
       ============================================================ -->
  <nav id="navbar" class="hidden sticky top-0 z-40 glass-card shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between items-center h-16">
        <!-- Logo y título -->
        <div class="flex items-center gap-3">
          <div class="w-9 h-9 bg-gradient-to-br from-primary-500 to-primary-700 rounded-xl flex items-center justify-center shadow-md">
            <span class="text-white font-bold text-sm">S21</span>
          </div>
          <h1 class="text-lg font-bold bg-gradient-to-r from-primary-600 to-primary-800 bg-clip-text text-transparent">
            Sistema de Gestión
          </h1>
        </div>

        <!-- Links de navegación -->
        <div class="flex items-center gap-1">
          <button onclick="navigateTo('users')" id="nav-users"
            class="nav-link px-4 py-2 rounded-lg text-sm font-medium text-surface-600 hover:text-primary-600 hover:bg-primary-50 transition-all duration-200">
            👥 Usuarios
          </button>
          <button onclick="navigateTo('products')" id="nav-products"
            class="nav-link px-4 py-2 rounded-lg text-sm font-medium text-surface-600 hover:text-primary-600 hover:bg-primary-50 transition-all duration-200">
            📦 Productos
          </button>
          <button onclick="navigateTo('sales')" id="nav-sales"
            class="nav-link px-4 py-2 rounded-lg text-sm font-medium text-surface-600 hover:text-primary-600 hover:bg-primary-50 transition-all duration-200">
            🧾 Ventas
          </button>
        </div>

        <!-- Info usuario y logout -->
        <div class="flex items-center gap-3">
          <div class="flex items-center gap-2 px-3 py-1.5 bg-surface-100 rounded-full">
            <div class="w-7 h-7 bg-gradient-to-br from-primary-400 to-primary-600 rounded-full flex items-center justify-center">
              <span id="user-avatar" class="text-white text-xs font-bold">U</span>
            </div>
            <span id="user-display-name" class="text-sm font-medium text-surface-700">Usuario</span>
          </div>
          <button onclick="handleLogout()" id="btn-logout"
            class="px-3 py-1.5 text-sm font-medium text-red-500 hover:text-red-700 hover:bg-red-50 rounded-lg transition-all duration-200">
            Salir ↗
          </button>
        </div>
      </div>
    </div>
  </nav>

  <!-- ============================================================
       SECCIÓN: LOGIN / REGISTRO
       ============================================================ -->
  <section id="auth-section" class="min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md">
      <!-- Card de autenticación -->
      <div class="glass-card rounded-2xl shadow-xl p-8">
        <!-- Header con logo -->
        <div class="text-center mb-8">
          <div class="w-16 h-16 bg-gradient-to-br from-primary-500 to-primary-700 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg">
            <span class="text-white font-bold text-2xl">S21</span>
          </div>
          <h2 class="text-2xl font-bold text-surface-900">Sistema de Gestión</h2>
          <p class="text-surface-500 text-sm mt-1">Aplicaciones Web 2 — IES Siglo 21</p>
        </div>

        <!-- Tabs Login / Registro -->
        <div class="flex bg-surface-100 rounded-xl p-1 mb-6">
          <button id="tab-login" onclick="switchAuthTab('login')"
            class="flex-1 py-2.5 text-sm font-semibold rounded-lg transition-all duration-200 bg-white text-primary-600 shadow-sm">
            Iniciar Sesión
          </button>
          <button id="tab-register" onclick="switchAuthTab('register')"
            class="flex-1 py-2.5 text-sm font-semibold rounded-lg transition-all duration-200 text-surface-500 hover:text-surface-700">
            Registrarse
          </button>
        </div>

        <!-- Formulario Login -->
        <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
          <div>
            <label for="login-username" class="block text-sm font-medium text-surface-700 mb-1.5">Usuario</label>
            <input type="text" id="login-username" required placeholder="Ingrese su usuario"
              class="w-full px-4 py-2.5 bg-surface-50 border border-surface-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent transition-all duration-200">
          </div>
          <div>
            <label for="login-password" class="block text-sm font-medium text-surface-700 mb-1.5">Contraseña</label>
            <input type="password" id="login-password" required placeholder="Ingrese su contraseña"
              class="w-full px-4 py-2.5 bg-surface-50 border border-surface-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent transition-all duration-200">
          </div>
          <button type="submit" id="btn-login"
            class="btn-primary w-full py-2.5 bg-gradient-to-r from-primary-500 to-primary-600 text-white font-semibold rounded-xl shadow-md hover:from-primary-600 hover:to-primary-700 transition-all duration-200">
            Iniciar Sesión
          </button>
        </form>

        <!-- Formulario Registro -->
        <form id="register-form" onsubmit="handleRegister(event)" class="space-y-4 hidden">
          <div>
            <label for="register-name" class="block text-sm font-medium text-surface-700 mb-1.5">Nombre completo</label>
            <input type="text" id="register-name" required placeholder="Ingrese su nombre"
              class="w-full px-4 py-2.5 bg-surface-50 border border-surface-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent transition-all duration-200">
          </div>
          <div>
            <label for="register-username" class="block text-sm font-medium text-surface-700 mb-1.5">Usuario</label>
            <input type="text" id="register-username" required placeholder="Elija un nombre de usuario"
              class="w-full px-4 py-2.5 bg-surface-50 border border-surface-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent transition-all duration-200">
          </div>
          <div>
            <label for="register-password" class="block text-sm font-medium text-surface-700 mb-1.5">Contraseña</label>
            <input type="password" id="register-password" required placeholder="Elija una contraseña"
              class="w-full px-4 py-2.5 bg-surface-50 border border-surface-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent transition-all duration-200">
          </div>
          <button type="submit" id="btn-register"
            class="btn-primary w-full py-2.5 bg-gradient-to-r from-primary-500 to-primary-600 text-white font-semibold rounded-xl shadow-md hover:from-primary-600 hover:to-primary-700 transition-all duration-200">
            Crear Cuenta
          </button>
        </form>

        <!-- Mensaje de error -->
        <div id="auth-error" class="hidden mt-4 p-3 bg-red-50 border border-red-200 text-red-600 text-sm rounded-xl text-center"></div>
      </div>

      <!-- Créditos -->
      <p class="text-center text-surface-400 text-xs mt-6">
        Examen Final — Aplicaciones Web 2 — IES Siglo 21
      </p>
    </div>
  </section>

  <!-- ============================================================
       SECCIÓN: DASHBOARD PRINCIPAL (contenido dinámico)
       ============================================================ -->
  <main id="main-content" class="hidden max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <!-- El contenido se inyecta dinámicamente desde los componentes JS -->
  </main>

  <!-- ============================================================
       MODAL GENÉRICO (para formularios de crear/editar)
       ============================================================ -->
  <div id="modal-overlay" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4">
    <!-- Fondo oscuro -->
    <div class="absolute inset-0 bg-surface-900/50 backdrop-blur-sm" onclick="closeModal()"></div>
    <!-- Contenido del modal -->
    <div id="modal-content" class="relative glass-card rounded-2xl shadow-2xl w-full max-w-lg max-h-[90vh] overflow-y-auto p-6 section-view">
      <!-- Se llena dinámicamente -->
    </div>
  </div>

  <!-- ============================================================
       SCRIPTS - Módulos JS (ES6 modules)
       ============================================================ -->
  <script type="module" src="./js/index.js"></script>

</body>
</html>
